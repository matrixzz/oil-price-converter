<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美国油价 ⇄ 中国油价 转换器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 520px;
            width: 100%;
            padding: 36px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .rate-bar {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 10px 16px;
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 24px;
        }
        .rate-bar span { font-weight: 600; color: #4a5acf; }
        .rate-bar.error { background: #fff0f0; color: #c00; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }
        select:focus, input:focus { border-color: #667eea; }

        .section { margin-bottom: 20px; }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            gap: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-top: 1px solid #e0e0e0;
        }
        .divider-icon {
            font-size: 1.4rem;
            color: #667eea;
        }

        .result-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            color: #fff;
        }
        .result-label {
            font-size: 0.8rem;
            opacity: 0.85;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-value {
            font-size: 2.2rem;
            font-weight: 700;
        }
        .result-unit {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        .direction-toggle {
            display: flex;
            background: #f0f4ff;
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .direction-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }
        .direction-toggle button.active {
            background: #667eea;
            color: #fff;
            border-radius: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #aaa;
        }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>美国油价 ⇄ 中国油价</h1>
        <p class="subtitle">USD/Gallon ⇄ CNY/Liter 实时转换</p>

        <div class="rate-bar" id="rateBar">
            汇率加载中...
        </div>

        <div class="direction-toggle">
            <button id="btnUS2CN" class="active" onclick="setDirection('us2cn')">美国 → 中国</button>
            <button id="btnCN2US" onclick="setDirection('cn2us')">中国 → 美国</button>
        </div>

        <div id="inputSection">
            <!-- Dynamic content based on direction -->
        </div>

        <div class="divider"><span class="divider-icon">⇅</span></div>

        <div class="result-box">
            <div class="result-label" id="resultLabel">中国油价</div>
            <div class="result-value" id="resultValue">--</div>
            <div class="result-unit" id="resultUnit">元/升</div>
        </div>

        <p class="footer">
            汇率数据来自 <a href="https://xe.com" target="_blank">xe.com</a> (通过 exchangerate.host)
            <br>油价数据来自 AAA 全美平均参考价
        </p>
    </div>

<script>
// 1 US gallon = 3.78541 liters
const GALLON_TO_LITER = 3.78541;

// Average gas prices (regular unleaded) for major US cities - updated reference
// Source: AAA Gas Prices
const cityPrices = {
    seattle:  { name: "西雅图 Seattle",         price: 4.19 },
    sanfran:  { name: "旧金山 San Francisco",    price: 4.89 },
    la:       { name: "洛杉矶 Los Angeles",      price: 4.69 },
    newyork:  { name: "纽约 New York",           price: 3.49 },
    dc:       { name: "华盛顿DC Washington DC",  price: 3.39 },
};

let exchangeRate = null; // USD -> CNY
let direction = 'us2cn';

// Fetch exchange rate
async function fetchRate() {
    const bar = document.getElementById('rateBar');
    try {
        // Try multiple free exchange rate APIs
        let rate = null;

        // API 1: exchangerate-api (free tier)
        try {
            const r1 = await fetch('https://open.er-api.com/v6/latest/USD');
            const d1 = await r1.json();
            if (d1.result === 'success' && d1.rates && d1.rates.CNY) {
                rate = d1.rates.CNY;
            }
        } catch(e) {}

        // API 2: fallback
        if (!rate) {
            try {
                const r2 = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const d2 = await r2.json();
                if (d2.rates && d2.rates.CNY) {
                    rate = d2.rates.CNY;
                }
            } catch(e) {}
        }

        if (rate) {
            exchangeRate = rate;
            bar.innerHTML = `实时汇率 (xe.com 参考): <span>1 USD = ${rate.toFixed(4)} CNY</span>`;
            bar.classList.remove('error');
            convert();
        } else {
            throw new Error('无法获取汇率');
        }
    } catch (e) {
        // Use a reasonable fallback
        exchangeRate = 7.27;
        bar.innerHTML = `汇率获取失败，使用参考汇率: <span>1 USD = ${exchangeRate} CNY</span>`;
        bar.classList.add('error');
        convert();
    }
}

function setDirection(dir) {
    direction = dir;
    document.getElementById('btnUS2CN').classList.toggle('active', dir === 'us2cn');
    document.getElementById('btnCN2US').classList.toggle('active', dir === 'cn2us');
    renderInput();
    convert();
}

function renderInput() {
    const section = document.getElementById('inputSection');
    if (direction === 'us2cn') {
        section.innerHTML = `
            <div class="section">
                <label>选择城市油价 (Regular Unleaded)</label>
                <select id="citySelect" onchange="onCityChange()">
                    <option value="">-- 选择城市 --</option>
                    ${Object.entries(cityPrices).map(([k, v]) =>
                        `<option value="${k}">${v.name} — $${v.price.toFixed(2)}/gal</option>`
                    ).join('')}
                    <option value="custom">自定义价格</option>
                </select>
            </div>
            <div class="section" id="customInput" style="display:none;">
                <label>输入油价 (USD/Gallon)</label>
                <input type="number" id="priceInput" step="0.01" min="0" placeholder="例如: 3.99" oninput="convert()">
            </div>
        `;
    } else {
        section.innerHTML = `
            <div class="section">
                <label>输入中国油价 (人民币/升)</label>
                <input type="number" id="cnyInput" step="0.01" min="0" placeholder="例如: 7.89" oninput="convert()">
            </div>
        `;
        document.getElementById('resultLabel').textContent = '美国油价';
        document.getElementById('resultUnit').textContent = '美元/加仑 (USD/Gallon)';
    }
}

function onCityChange() {
    const sel = document.getElementById('citySelect');
    const customDiv = document.getElementById('customInput');
    if (sel.value === 'custom') {
        customDiv.style.display = 'block';
    } else {
        customDiv.style.display = 'none';
    }
    convert();
}

function convert() {
    if (!exchangeRate) return;

    const resultValue = document.getElementById('resultValue');
    const resultLabel = document.getElementById('resultLabel');
    const resultUnit = document.getElementById('resultUnit');

    if (direction === 'us2cn') {
        resultLabel.textContent = '中国油价';
        resultUnit.textContent = '元/升 (CNY/Liter)';

        let usdPerGallon = null;
        const sel = document.getElementById('citySelect');
        if (sel) {
            if (sel.value && sel.value !== 'custom') {
                usdPerGallon = cityPrices[sel.value].price;
            } else if (sel.value === 'custom') {
                const inp = document.getElementById('priceInput');
                if (inp && inp.value) usdPerGallon = parseFloat(inp.value);
            }
        }

        if (usdPerGallon && usdPerGallon > 0) {
            const cnyPerLiter = (usdPerGallon * exchangeRate) / GALLON_TO_LITER;
            resultValue.textContent = cnyPerLiter.toFixed(2);
        } else {
            resultValue.textContent = '--';
        }
    } else {
        resultLabel.textContent = '美国油价';
        resultUnit.textContent = '美元/加仑 (USD/Gallon)';

        const inp = document.getElementById('cnyInput');
        if (inp && inp.value) {
            const cnyPerLiter = parseFloat(inp.value);
            const usdPerGallon = (cnyPerLiter * GALLON_TO_LITER) / exchangeRate;
            resultValue.textContent = usdPerGallon.toFixed(2);
        } else {
            resultValue.textContent = '--';
        }
    }
}

// Init
renderInput();
fetchRate();
</script>
</body>
</html>
